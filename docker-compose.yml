services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: psylink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: psylink
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - psylink_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psylink"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  psylink_data:
